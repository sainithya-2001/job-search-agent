# Copy to config.local.yaml (gitignored) and fill in. Layered over config.yaml: nested sections merge, lists
# replace. Use it for anything personal, such as rules that name your master_resume.yaml ids.
# The ids below match the fictional sample resume (data/master_resume.example.yaml); replace them with yours.

scoring:
  # Optional sentence for the scoring prompt, inserted before the sponsorship rule. End it with a space, e.g.
  # "Work authorization: <your status>. ". Empty = nothing is added.
  work_authorization: ""

tailoring:
  optional_experience: [exp_contoso]           # experience entries that may be dropped to fit one page
  required_bullets:                            # bullets that must appear for these role families
    - {ids: [exp_northwind_b02], families: [ai_engineer, analyst_backup], unless_title: 'business analyst',
       why: "key metric bullet for AI and analytics roles"}
  preferences:                                 # if `over` is used, `prefer` must be used too
    - {prefer: exp_contoso_b02, over: exp_contoso_b01, why: "stronger bullet first"}
