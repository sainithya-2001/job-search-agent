# Run the test suite on every push and pull request.
# No secrets: the tests use fakes and local HTML only, and need neither data/ (personal files, gitignored) nor .env.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Fails if a personal or generated file was ever added to the repo (see .gitignore).
      - name: No personal or generated files tracked
        run: |
          bad=$(git ls-files | grep -E '^\.env$|^data/(jobs\.db|master_resume\.yaml|answer_bank\.yaml|google_service_account\.json|backups/|resumes/|uscis/)|^output/|^logs/' || true)
          if [ -n "$bad" ]; then echo "These must not be committed:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q

  # Build the Docker image on every push and PR. It is never run or pushed, and no secrets are used.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t job-agent:ci .

      # Inspect the image's files without starting it: create a stopped container and list its filesystem.
      - name: Image contains no personal or generated files
        run: |
          id=$(docker create job-agent:ci)
          docker export "$id" | tar -t > files.txt
          docker rm "$id" > /dev/null
          bad=$(grep -E '^app/(\.env$|data/.+|output/.+|logs/.+|evals/label_me\.csv|tests/)' files.txt \
                | grep -v '^app/data/answer_bank\.example\.yaml$' || true)
          if [ -n "$bad" ]; then echo "Found in image:"; echo "$bad"; exit 1; fi
          grep -q '^app/main.py$' files.txt && grep -q '^app/src/notion.py$' files.txt
          echo "OK: $(grep -c '^app/' files.txt) files under /app, none personal"
