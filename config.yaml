jsearch:
  # Aggregator source (RapidAPI). Runs only when enabled AND JSEARCH_API_KEY is set in .env.
  enabled: true
  date_posted: month         # JSearch buckets: all | today | 3days | week | month. "month" covers 14 days; the
                             # 14-day filters.max_posting_age_days then applies like every other source.
  pages_per_query: 1         # ~10 jobs per page; each query x location = 1 API request (8 x 4 = 32 per search)
  locations:                 # every query runs once per location
    - {name: "Atlanta, GA", query: "in Atlanta, GA"}
    - {name: California,   query: "in California"}
    - {name: Texas,        query: "in Texas"}
    - {name: US remote,    query: "",  remote: true}
  queries:
    - AI Engineer
    - Applied AI Engineer
    - Forward Deployed Engineer
    - AI Solutions Engineer
    - AI Consultant
    - AI Evaluation
    - Analytics Engineer
    - Data Analyst AI
  # Employers dropped before anything else (staffing agencies, body shops, marketplaces).
  # No generic "consulting" pattern: it would drop BCG (BCG X is a target). IT-services firms are listed by name.
  exclude_employers: ['staffing', 'recruit', '\btalent\b', 'infotech', '\bsolutions,? (inc|llc)\b',
                      'teksystems', 'robert half', 'randstad', 'insight global', 'kforce', 'apex systems', 'cybercoders',
                      '\bdice\b', 'jobot', 'motion recruitment', 'mercor', '\bturing\b', 'toptal', 'hcl', 'infosys',
                      'wipro', 'cognizant', 'tata consultancy', 'capgemini', 'accenture']

filters:
  # Role families in priority order. A title is kept if it matches any pattern;
  # the first family that matches is recorded as the job's role hint.
  # Patterns are case-insensitive regular expressions.
  role_families:
    - name: ai_engineer
      patterns: ['\bai engineer', '\bapplied ai\b', '\bgen ?ai\b', '\bgenerative ai\b', '\bllms?\b', '\bai/ml engineer', '\bengineer\b.*\b(ai|llm)\b']
      # Evaluation titles belong to ai_eval even though they also say AI/LLM.
      exclude: ['\b(ai|model|llm) evaluations?\b', '\bevals\b', '\bai quality\b']
    - name: ai_solutions
      patterns: ['\bsolutions? (engineer|architect)', '\bai solutions\b', '\bai deployment\b']
    - name: forward_deployed
      patterns: ['\bforward[- ]deployed\b', '\bdeployment strategist\b']
    - name: ai_consultant
      patterns: ['\bai (consultant|strategist|strategy|advisor|transformation)\b']
    - name: ai_eval
      patterns: ['\bai evaluations?\b', '\bmodel evaluations?\b', '\bllm evaluations?\b', '\bevals\b', '\bai quality\b']
      # A family can exclude titles: a match here skips this family (later families may still match).
      exclude: ['\bresearch scientists?\b', '\bback[- ]?end\b']
    - name: analyst_backup
      patterns: ['\bdata analyst\b', '\bbusiness analyst\b', '\banalytics engineer\b']

  # Titles dropped regardless of family: too senior for 0–5 yrs, or not a full-time IC role.
  # "Senior" is intentionally NOT here — kept per Nithya; Phase 2 judges seniority from the posting.
  title_exclude: ['\b(staff|principal|distinguished|director|head of|vp|vice president|chief|manager|lead)\b', '\bintern(ship)?\b',
                  # Engineering specialties outside the target roles — dropped even when the title says AI.
                  '\bfront[- ]?end\b', '\bfull[- ]?stack\b', '\binfrastructure\b', '\binfra\b', '\bplatform\b',
                  '\bsecurity\b', '\bappsec\b', '\bsystems? engineer', '\bsre\b', '\bsite reliability\b', '\bdevops\b',
                  '\bnetwork operations\b', '\bchip design\b', '\bhardware\b',
                  '\bmobile\b', '\bios\b', '\bandroid\b']

  # Other specialties dropped UNLESS the title also matches `ai_title_terms`
  # ("Backend Engineer" is dropped; "Backend Engineer, LLM" is kept).
  title_exclude_unless_ai: ['\bembedded\b', '\bfirmware\b', '\bback[- ]?end\b']
  ai_title_terms: ['\bai\b', '\bml\b', '\bmachine learning\b', '\bllms?\b', '\bgen ?ai\b']

  # Description phrases that disqualify a posting (citizenship, clearance, export control, staffing/contract).
  exclude_phrases:
    # Sponsorship statements ("no sponsorship", "authorized to work without sponsorship") are NOT excluded
    # (2026-10-11). Citizenship, clearance, export-control, and permanent-resident requirements still are.
    - '\bmust be a u\.?s\.? citizen'
    - '\bu\.?s\.? citizenship (is )?required'
    - '\bu\.?s\.? citizens? only\b'
    - '\bonly (open to |available to )?u\.?s\.? citizens\b'
    - '\b(security|government|secret|ts/sci|top secret) clearance\b'
    - '\bactive clearance\b'
    - '\bc2c\b'
    - '\bcorp[- ]to[- ]corp\b'
    - '\bw-?2 through (a |our )?vendor'
    - '\bcontract[- ]only\b'
    # Export control / US-person requirements. ITAR and EAR match case-sensitively ("ear", "year" don't count).
    - '\bexport[- ]controlled\b'
    - '(?-i:\bITAR\b)'
    - '(?-i:\bEAR\b)'
    - '\bU\.?S\.? persons?\b'
    # Skipped when followed by sponsor/process/support, so "we support green card sponsorship" doesn't exclude a job.
    - '\bpermanent residen(t|ts|cy)\b(?!\s*(sponsor|process|support|application))'
    - '\bgreen[- ]cards?\b(?!\s*(sponsor|process|support|application))'

  # Employment types (from the ATS) that are dropped.
  exclude_employment_types: [contract, contractor, temporary, intern, internship]

  # Keep only postings with at least one US location. Remote roles must be US-remote ("Remote - US",
  # "Remote (United States)", "US-based remote", or remote + a US location). Remote roles limited to other
  # countries/regions are dropped, and so are remote roles restricted to states outside remote_allowed_states.
  # A bare "Remote" with no country is kept only if the posting text says US-remote.
  # A bare "Remote" is also kept when the company's hq (in `companies`) is US.
  us_only: true
  remote_allowed_states: [GA, CA, TX]

  # Postings older than this are dropped. Dates: Greenhouse first_published, Lever createdAt, Ashby publishedAt
  # (all original posting dates, never last-updated). Jobs with no reliable date are kept (ranked as not fresh).
  max_posting_age_days: 14
