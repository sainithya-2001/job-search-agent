# Job agent configuration. Secrets live in .env, never here.

llm:
  provider: anthropic          # gemini | anthropic  <- the one line to change to switch providers
  models:                   # "fast" = first-pass scoring of every job; "strong" = re-score jobs >= escalate_threshold
    gemini:    {fast: gemini-3.5-flash-lite, strong: gemini-3.8-flash}     
    anthropic: {fast: claude-haiku-5-5,     strong: claude-sonnet-5-5, effort: {fast: low, strong: medium}}
  retry: {max_attempts: 5, base_delay: 2, max_delay: 60}   # seconds; applies to 429 / 5xx / network errors
  # USD per 1M tokens (Anthropic list prices, 2026-10). Haiku's price applies to prompts up to 100K tokens.
  # Models missing here report cost as unknown.
  pricing:
    claude-haiku-5-5:  {input: 0.10, output: 0.50}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-opus-5-5:   {input: 4.00, output: 20.00}

scoring:
  escalate_threshold: 60    # fast-tier fit_score at or above this gets re-scored by the strong tier
  default_limit: 20         # jobs scored per `python main.py score` run unless --limit is given
  max_per_company: 3        # diversity cap when picking which jobs to score
  max_run_cost_usd: 0.50    # refuse to start if the worst-case estimate exceeds this; stop mid-run if actual does
  # Output tokens assumed per call for the estimate (includes thinking, which bills as output).
  est_output_tokens: {fast: 600, strong: 1200}
  # `python main.py score --mix`: pick n jobs per bucket, only from these company tiers.
  mix:
    tiers: [startup, growth]
    buckets:
      - {name: solutions_fde,      families: [ai_solutions, forward_deployed], n: 5}
      - {name: consultant_eval,    families: [ai_consultant, ai_eval],         n: 5}
      - {name: analyst_analytics,  families: [analyst_backup],                 n: 5}
      - {name: ai_engineer,        families: [ai_engineer],                    n: 5}

# Phase 4: `python main.py run` (daily agent loop). Every limit here is enforced in code, not by the prompt.
agent:
  tier: fast                    # model that drives the loop (cheap: it only picks tools; scoring/tailoring use their own tiers)
  max_run_cost_usd: 0.50        # hard cap for the whole run: model turns + scoring + tailoring
  max_tool_calls: 30
  max_consecutive_failures: 2   # a tool failing this many times in a row stops the run
  max_turns: 25                 # model turns (backstop against a model that keeps talking without finishing)
  score_limit: 15               # jobs scored per run
  max_score_cost_usd: 0.15      # scoring's share of the cap, so tailoring always has budget left
  tailor_min_score: 65
  max_tailor_per_run: 5
  agent_reserve_usd: 0.02       # held back from tools so the model can always finish
  est_turn_input_tokens: 4000   # for the dry-run estimate and the per-turn budget check
  est_output_tokens: 400

# Phase 5: applications. Review mode only: the agent pre-fills and queues, Nithya reviews and clicks Submit.
# The gates below run in SHADOW mode: they record whether an application would have qualified for auto-submit,
# but there is no submit code. Answers live in data/answer_bank.yaml (gitignored).
apply:
  auto_submit: false            # must stay false: true is rejected at startup (no submit code exists)
  min_fit: 70
  auto_ats: [greenhouse, lever]
  max_per_day: 5
  company_window_days: 90       # per company, per window: counts every application, manual ones included
  company_max_applications: 2   # ...and a 2nd one only for a different role family than the 1st

tailoring:
  # Headline = optional role label + skills from master_resume.yaml. The label must come from the list for the
  # job's role family (the families in filters.role_families). No other labels; no seniority words.
  headline_role_labels:
    ai_engineer:      [AI Engineer, Applied AI]
    ai_solutions:     [AI Solutions Engineer]
    forward_deployed: [Forward Deployed Engineer]
    ai_consultant:    [AI Consultant]
    ai_eval:          [AI Evaluation]
    analyst_backup:   [Data Analyst, Business Analyst, Analytics Engineer]
  headline_forbidden_words: [Senior, Lead, Principal, Staff]
  max_headline_skills: 4
  # Experience entries that may be dropped (e.g. to fit one page). All others must appear, in order.
  optional_experience: [exp_emp_c]
  # Bullets that must be cited for these role families (unless the job title matches unless_title).
  required_bullets:
    - {ids: [exp_emp_a_b04], families: [ai_engineer, ai_solutions, forward_deployed, ai_consultant, ai_eval, analyst_backup],
       unless_title: 'business analyst', why: "key metric bullet for AI and analytics roles"}
  # Projects that must be included for these role families.
  required_projects:
    - {id: proj_job_agent, families: [ai_engineer, ai_solutions, forward_deployed, ai_consultant, ai_eval]}
  # If `over` is used, `prefer` must be used too.
  preferences:
    - {prefer: exp_univ_b01, over: exp_univ_b03, why: "stronger bullet first"}
  tier: strong               # model tier for drafting and for the LLM fact-check
  max_attempts: 3            # drafts per job before unsupported bullets are removed
  max_run_cost_usd: 0.75     # per `python main.py tailor` run, across all jobs in it
  # Output tokens assumed per call for the estimate (includes thinking).
  est_output_tokens: {draft: 3000, verify: 1500}

# Ordering of results and of tailoring (src/scorer.py). Sort order: fit_score, freshness, sponsorship, tier,
# location. On top of that, preferred jobs may go ahead of jobs scoring a few points higher:
#   freshness   (ranking AND tailoring): a job posted within fresh_days goes ahead of an older job scoring up to
#               freshness_preference_points higher. No reliable date = not fresh.
#   sponsorship (tailoring only): a sponsorship-"yes" job goes ahead of a non-"yes" job scoring up to
#               sponsorship_preference_points higher, unless that would put an older job ahead of a fresh one.
ranking:
  fresh_days: 3
  freshness_preference_points: 5
  sponsorship_preference_points: 3

preferences:
  # Job-location preference. Lower rank = preferred; equal ranks tie. Used to rank jobs, not to filter them.
  # A tier matches if any pattern hits the location string (case-insensitive regex). When the ATS flags the
  # job as remote, " remote" is appended to the string before matching, so US-Remote catches flagged jobs too.
  location_priority:
    - {name: "Atlanta, GA", rank: 0, patterns: ['\batlanta\b', ',\s*GA\b', '\bgeorgia\b']}
    - {name: US-Remote,     rank: 0, patterns: ['(?=.*\bremote\b)(?=.*(\bUS\b|\bUSA\b|\bU\.S\.|\bunited states\b|\bus-based\b))']}
    - {name: California,    rank: 1, patterns: ['\bcalifornia\b', ',\s*CA\b', '\bsan francisco\b', '\bbay area\b', '\blos angeles\b', '\bsan diego\b', '\bsan jose\b', '\bpalo alto\b', '\bmountain view\b', '\bmenlo park\b', '\bsunnyvale\b', '\bsan mateo\b', '\bredwood city\b', '\boakland\b', '\bfoster city\b', '\bsanta clara\b', '\bUS-CA-']}
    - {name: Texas,         rank: 2, patterns: ['\btexas\b', ',\s*TX\b', '\baustin\b', '\bdallas\b', '\bhouston\b', '\bsan antonio\b']}
    - {name: Anywhere in US, rank: 3, patterns: ['.*']}     # fallback: any job that passed the US-only filter

