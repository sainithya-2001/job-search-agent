# Job agent configuration. Secrets live in .env, never here.

llm:
  provider: anthropic          # gemini | anthropic  <- the one line to change to switch providers
  models:                   # "fast" = first-pass scoring of every job; "strong" = re-score jobs >= escalate_threshold
    gemini:    {fast: gemini-3.5-flash-lite, strong: gemini-3.8-flash}     
    anthropic: {fast: claude-haiku-5-5,     strong: claude-opus-5-5}
  retry: {max_attempts: 5, base_delay: 2, max_delay: 60}   # seconds; applies to 429 / 5xx / network errors

scoring:
  escalate_threshold: 60    # fast-tier fit_score at or above this gets re-scored by the strong tier

